<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>MITCH CRM — установка</title><style>
:root{font:18px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:#f5f5ef;background:#121310}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:28px 18px}main{width:min(600px,100%)}header{display:flex;align-items:center;gap:13px;font-weight:800;font-size:25px;letter-spacing:.04em;margin-bottom:54px}.monogram{width:46px;height:46px;display:grid;place-items:center;background:#ffe000;color:#111;border-radius:13px;font-size:32px;line-height:1;font-weight:950}h1{font-size:clamp(32px,6vw,46px);line-height:1.15;letter-spacing:-.03em;margin:0 0 32px}button,a.btn{font:inherit;border-radius:16px;min-height:64px;border:1px solid #8e9486;background:#1e201b;color:#f5f5ef;cursor:pointer;text-align:center;text-decoration:none;padding:16px 22px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:9px}.primary{width:100%;background:#ffe000!important;color:#111!important;border-color:#ffe000!important;margin-top:24px;font-size:21px!important}button:hover,a.btn:hover{filter:brightness(1.12)}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:4px}button:disabled{opacity:.55;cursor:wait}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{flex-direction:column;min-height:108px;font-size:20px}.choice[aria-pressed="true"]{border:2px solid #ffe000;background:#2a2b18;color:#ffe779}.symbol{font-size:26px;font-weight:800;line-height:1}.back{border:0;padding:0;min-height:36px;background:transparent;font-size:16px;margin-bottom:20px;color:#c5c9bd}.status{font-size:16px;color:#d2d6c8;line-height:1.5;margin:18px 0 0;overflow-wrap:anywhere}.subtle{font-size:14px;color:#aeb5a3}.subtle a{color:inherit}progress{width:100%;accent-color:#ffe000;margin-top:16px}#windows-ready{margin-top:15px;width:100%}[hidden]{display:none!important}@media(max-width:400px){header{margin-bottom:36px}.choice{font-size:18px;padding:12px}.choices{gap:10px}h1{font-size:32px}}
</style></head><body><main><header><span class="monogram" aria-hidden="true">М</span>MITCH CRM</header><section id="welcome"><h1>Ваша CRM.<br>На любом устройстве.</h1><button class="primary" id="next">Далее</button></section><section id="choose" hidden><button class="back" id="back">‹ Назад</button><h1>Где установить?</h1><div class="choices" role="group" aria-label="Выберите устройство"><button class="choice" data-platform="windows" aria-pressed="true"><span class="symbol" aria-hidden="true">⊞</span>Windows</button><button class="choice" data-platform="android" aria-pressed="false"><span class="symbol" aria-hidden="true">▯</span>Android</button><button class="choice" data-platform="apple" aria-pressed="false"><span class="symbol" aria-hidden="true">М</span>MacBook / iPhone</button><button class="choice" data-platform="browser" aria-pressed="false"><span class="symbol" aria-hidden="true">◎</span>Браузер</button></div><button id="install-windows" data-windows-download class="primary" disabled>Установить</button><a id="install-link" class="btn primary" hidden>Установить</a><p id="cloud-status" class="status" role="status">Проверяем доступность…</p><p id="device-hint" class="status" hidden></p><p id="windows-status" class="status" role="status"></p><progress id="windows-progress" max="100" value="0" aria-label="Загрузка установщика" hidden></progress><a id="windows-ready" class="btn" hidden>Сохранить установщик</a></section></main><script src="simple-start.js" defer></script><script src="online-download.js" defer></script></body></html>
